[project]
name = "osc-mcp"
version = "0.1.0"
description = "MCP Server for controlling audio equipment via OSC protocol"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "python-osc",
]

[project.scripts]
osc-mcp = "osc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osc_mcp"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
