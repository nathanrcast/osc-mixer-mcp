[project]
name = "osc-mixer-mcp"
version = "0.4.0"
description = "Hardened MCP server for controlling Behringer X-Air, X32/M32 and WING mixers via OSC"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0,<2.0",
    "python-osc>=1.9,<2.0",
]

[project.scripts]
osc-mixer-mcp = "osc_mcp.server:main"
# Kept so existing MCP client registrations keep working.
osc-xr18-mcp = "osc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osc_mcp"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
